name: Import complete project

on:
  push:
    branches:
      - main
    paths:
      - imobiliaria-aspnet-core.zip
      - .github/workflows/import-project.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  import:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Expand validated source archive
        shell: bash
        run: |
          set -euo pipefail
          rm -rf .project-import
          mkdir .project-import
          unzip -q imobiliaria-aspnet-core.zip -d .project-import
          shopt -s dotglob nullglob
          cp -R .project-import/imobiliaria-aspnet-core/* .
          rm -rf .project-import
          rm -f imobiliaria-aspnet-core.zip
          rm -f .github/workflows/ci.yml

      - name: Publish source tree
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "feat: publish modernized real estate project"
          git push
