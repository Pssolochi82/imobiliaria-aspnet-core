name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
          cache: true
          cache-dependency-path: '**/*.csproj'

      - name: Restore
        run: dotnet restore Imobiliaria.slnx

      - name: Build
        run: dotnet build Imobiliaria.slnx --configuration Release --no-restore

      - name: Test
        run: dotnet test Imobiliaria.slnx --configuration Release --no-build --no-restore --collect:"XPlat Code Coverage"
